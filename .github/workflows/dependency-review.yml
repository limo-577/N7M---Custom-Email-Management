name: Dependency Risk Review

on:
  # Weekly Monday at 07:13 UTC; no application build or release is performed.
  schedule:
    - cron: "13 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Review accepted risks and upstream releases
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check accepted risks and upstream releases
        run: npm run check:dependencies:online

      - name: Audit dependency vulnerabilities
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=low
