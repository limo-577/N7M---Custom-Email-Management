
name: Windows Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check accepted dependency risks
        run: npm run check:dependencies

      - name: Audit dependency vulnerabilities
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=low

      - name: Run tests
        run: npm test

      - name: Build Windows packages
        run: npm run dist:all
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: N7M-Windows-x64
          path: |
            release/*-Setup.exe
            release/*-Portable.exe
            release/*-NoInstall.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged Windows release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # Download only this workflow run's completed build. Do not check out or
      # execute repository/dependency code while holding the release token.
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: N7M-Windows-x64
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release/*-Setup.exe
            release/*-Portable.exe
            release/*-NoInstall.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          token: ${{ github.token }}
